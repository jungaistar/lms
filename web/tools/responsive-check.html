<!DOCTYPE html>
<!--
  반응형 점검 도구.

  왜 있나 — 학생은 아이폰·안드로이드·태블릿·노트북 아무거나 들고 온다.
  브라우저 창을 줄여 보는 것으로는 부족하다. 창 크기를 바꿔도 뷰포트가
  안 따라오는 경우가 있고, 여러 폭을 오가며 비교하기도 번거롭다.

  이 페이지는 앱을 **고정 폭 iframe** 안에 띄운다. iframe 의 폭이 곧 CSS
  뷰포트라 미디어 쿼리가 그대로 걸린다. 같은 출처라 로그인 세션도 그대로 쓴다.

  쓰는 법
    cd web && npm run build && npm run responsive
    → http://localhost:4173/lms/responsive-check/ 를 연다

  주소로 바로 지정할 수도 있다.
    ?d=390x844&r=%23/teacher/course/<id>%3Fm%3Dlive
    ?d=390x2400&…  ← 세로로 길게 잡으면 iframe 안을 따로 스크롤하지 않아도 된다

  dist/ 는 빌드할 때마다 비워지므로 이 파일은 tools/ 에 두고 필요할 때 복사한다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>반응형 점검</title>
<style>
  body { margin: 0; background: #263041; color: #fff; font: 13px/1.5 system-ui, sans-serif; }
  .bar { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar input, .bar select { font: inherit; padding: 4px 6px; }
  .bar input.route { width: 420px; }
  .stage { padding: 8px 12px 40px; }
  .dev { display: inline-block; vertical-align: top; margin: 0 14px 14px 0; }
  .dev b { display: block; padding: 4px 0; font-size: 12px; color: #cbd5e1; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<div class="bar">
  <label>경로 <input class="route" id="route" value="#/teacher" /></label>
  <label>기기
    <select id="dev">
      <option value="390x844">아이폰 14 · 390x844</option>
      <option value="360x800">안드로이드 · 360x800</option>
      <option value="768x1024">아이패드 세로 · 768x1024</option>
      <option value="1024x768">아이패드 가로 · 1024x768</option>
      <option value="1280x800">노트북 · 1280x800</option>
    </select>
  </label>
  <button id="go">적용</button>
</div>
<div class="stage" id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  function render() {
    const route = document.getElementById('route').value;
    const parts = document.getElementById('dev').value.split('x');
    const w = Number(parts[0]), h = Number(parts[1]);
    stage.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'dev';
    box.innerHTML = '<b>' + w + ' x ' + h + '</b>';
    const f = document.createElement('iframe');
    f.width = w; f.height = h;
    f.src = '/lms/' + route;
    box.appendChild(f);
    stage.appendChild(box);
  }
  document.getElementById('go').addEventListener('click', render);
  const q = new URLSearchParams(location.search);
  if (q.get('r')) document.getElementById('route').value = q.get('r');
  if (q.get('d')) { const s=document.getElementById('dev'); if (![...s.options].some(o=>o.value===q.get('d'))) { const o=document.createElement('option'); o.value=q.get('d'); o.textContent='사용자 지정 '+q.get('d'); s.appendChild(o); } s.value=q.get('d'); }
  render();
</script>
</body>
</html>
