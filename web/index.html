<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 이름을 바꾸면 여기와 web/src/brand.ts 의 SERVICE 를 함께 고친다.
       이 파일은 React 가 뜨기 전에 읽히는 곳이라 brand.ts 를 못 쓴다. -->
  <title>상호평가 학습관리시스템 | 직업미래연구소</title>
  <meta name="description" content="직업미래연구소 · 정동엽 직업학박사 — 발표 상호평가 · 팀 기여도 평가" />
  <meta name="theme-color" content="#1b2a4a" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="직업미래연구소" />
  <meta property="og:title" content="상호평가 학습관리시스템" />
  <meta property="og:description" content="발표 상호평가 · 팀 기여도 평가" />
  <!-- 주소는 사용자 지정 도메인이 정본이다 (github.io 주소는 이리로 넘어온다).
       도메인을 바꾸면 여기와 web/public/CNAME 을 함께 고친다. -->
  <meta property="og:url" content="https://lms.miraejob.co.kr/" />
  <link rel="canonical" href="https://lms.miraejob.co.kr/" />

  <!-- 본문은 Pretendard(한글), 숫자·영문 라벨은 Outfit 을 쓴다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap"
  />

  <!-- 탭 아이콘. 예전에는 한 글자가 들어 있었는데 글자 대신 서로 오가는
       화살표 두 개로 바꿨다 — '상호'평가를 뜻하고, 16px 로 줄어도 뭉개지지
       않는다. 글자를 다시 넣지 말 것: 탭 제목 앞에 붙어 이름과 겹쳐 보인다. -->

    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%231b2a4a'/><stop offset='1' stop-color='%230046c8'/></linearGradient></defs><rect width='64' height='64' rx='15' fill='url(%23g)'/><path d='M12 19 h26 v-5 l14 8 -14 8 v-5 h-26 z' fill='white'/><path d='M52 39 h-26 v-5 l-14 8 14 8 v-5 h26 z' fill='white' opacity='0.75'/></svg>"
  />
</head>

  <div id="root"></div>

</html>
