<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&family=Noto+Color+Emoji&display=swap">
  <style>
  :root {
  --dc-cover: url("bg-cover.jpg");
  --dc-band: url("bg-band.jpg");
  --dc-campus: url("bg-campus.jpg");
  }
  html, body { margin: 0; padding: 0; background: #EFF0F2; }
  a { color: #005BAC; } a:hover { color: #00A5DE; }
/* ===========================================================================
   취업과 경력개발 — 학습자료 디자인 시스템
   ---------------------------------------------------------------------------
   근거: 학교 자체 강의자료 『창업과 기업가 정신』 1강 오리엔테이션.
   색·타이포·짜임새를 그 자료에서 그대로 따왔다 (팔레트는 그 파일의
   srgbClr 값을 그대로 옮긴 것이다).

   화면 코드에 색을 인라인으로 박지 말고 여기 토큰과 시맨틱 클래스를 쓸 것.
   =========================================================================== */

:root {
  /* 파랑 — 헤더 띠는 왼쪽 시안에서 오른쪽 남색으로 흐른다 */
  --dc-cyan:       #00A5DE;
  --dc-blue-400:   #4BA3E3;
  --dc-blue-500:   #0071CE;
  --dc-blue:       #005BAC;   /* 주 파랑 — 제목 · 강조 */
  --dc-blue-700:   #0B4E8A;
  --dc-blue-800:   #003F7D;
  --dc-navy:       #17365D;   /* 본문 제목 */
  --dc-navy-900:   #002A55;

  /* 면 */
  --dc-bg:         #EFF0F2;
  --dc-panel:      #FFFFFF;
  --dc-tint:       #F2F7FC;   /* 카드 · 강조 상자 바탕 */
  --dc-tint-2:     #DEEBF7;   /* 표 머리 · 옅은 파랑 면 */
  --dc-tint-3:     #E4F0FA;
  --dc-row:        #F7FAFD;   /* 표 줄무늬 */

  /* 선 */
  --dc-line:       #9DC3E6;   /* 파랑 선 — 가장 많이 쓴다 */
  --dc-line-2:     #D4DCE6;

  /* 글자 */
  --dc-ink:        #3B3838;
  --dc-ink-2:      #63666B;
  --dc-ink-3:      #8A8F96;

  /* 강조 */
  --dc-yellow:     #FFF100;   /* 헤더 칩 테두리 */
  --dc-red:        #C00000;
  --dc-red-tint:   #FDF3F3;
  --dc-orange:     #ED7D31;
  --dc-gold:       #D9A441;

  /* 타이포 */
  --dc-sans: "Noto Sans KR", "Pretendard", -apple-system, BlinkMacSystemFont,
             "Malgun Gothic", "맑은 고딕", sans-serif;
  --dc-num:  "Outfit", "Noto Sans KR", sans-serif;
  --dc-emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;

  /* 슬라이드 규격 (16:9) */
  --dc-w: 1280px;
  --dc-h: 720px;
  --dc-head-h: 56px;
  --dc-pad-x: 44px;
}

/* --------------------------------------------------------------- 슬라이드 틀 */
.slide {
  position: relative;
  width: var(--dc-w);
  height: var(--dc-h);
  overflow: hidden;
  background: var(--dc-bg);
  color: var(--dc-ink);
  font-family: var(--dc-sans);
  font-size: 20px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.slide * { box-sizing: border-box; }

/* 본문 바탕에 아주 옅게 깔리는 캠퍼스 사진 */
.slide--content::before,
.slide--toc::before {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; top: var(--dc-head-h);
  background: var(--dc-campus) center bottom / cover no-repeat;
  opacity: .5;
  pointer-events: none;
}
.slide > * { position: relative; z-index: 1; }

/* ------------------------------------------------------------------- 헤더 띠 */
.slide__head {
  height: var(--dc-head-h);
  padding: 0 24px 0 var(--dc-pad-x);
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(90deg, var(--dc-cyan) 0%, var(--dc-blue-500) 52%, var(--dc-blue) 100%);
}
/* 섹션 이름은 노란 테를 두른 칩에 담는다 */
.slide__chip {
  display: inline-flex; align-items: center; gap: 10px;
  height: 34px; padding: 0 18px;
  border: 2px solid var(--dc-yellow);
  background: rgba(0, 42, 85, .30);
  color: #FFFFFF; font-size: 20px; font-weight: 800; letter-spacing: -.02em;
  white-space: nowrap;
}
.slide__chipno {
  font-family: var(--dc-num); font-size: 19px; font-weight: 700;
  color: var(--dc-yellow); line-height: 1;
}

/* dima 워드마크 */
.wordmark {
  font-family: var(--dc-num);
  font-weight: 800; font-size: 40px; line-height: 1;
  letter-spacing: -.055em; color: #FFFFFF; user-select: none;
}
.wordmark--dark { color: var(--dc-navy); }
.wordmark i { font-style: normal; position: relative; }
.wordmark i::after {
  content: ""; position: absolute; left: 50%; top: -.26em;
  width: .19em; height: .19em; border-radius: 50%;
  background: currentColor; transform: translateX(-50%);
}
.slide__head .wordmark { margin-top: 9px; }

/* ------------------------------------------------- 3중 스트라이프 (시그니처) */
.stripes { display: block; width: 100%; height: 26px; }

/* ------------------------------------------------------------------- 본문 틀 */
.slide__body {
  height: calc(var(--dc-h) - var(--dc-head-h));
  padding: 22px var(--dc-pad-x) 42px;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 0;
}
.slide__lede {
  font-size: 31px; font-weight: 800; letter-spacing: -.025em;
  color: var(--dc-navy);
}
.slide__cols {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  align-items: stretch; flex: 1 1 auto; min-height: 0;
}
.slide__cols--wide-left { grid-template-columns: 1.12fr .88fr; }
.slide__cols--wide-right { grid-template-columns: .88fr 1.12fr; }
.stack { display: flex; flex-direction: column; gap: 13px; min-height: 0; min-width: 0; }
.slide__no {
  position: absolute; left: 0; right: 0; bottom: 12px;
  text-align: center; font-family: var(--dc-num);
  font-size: 14px; color: var(--dc-ink-3);
}

/* --------------------------------------------------------------- 텍스트 요소 */
.h-sub {
  font-size: 24px; font-weight: 800; letter-spacing: -.02em;
  color: var(--dc-blue);
  display: flex; align-items: baseline; gap: 8px;
}
.p { font-size: 20px; color: var(--dc-ink); }
.p--lg { font-size: 23px; }
.em { color: var(--dc-red); font-weight: 800; font-style: normal; }
.strong { font-weight: 800; color: var(--dc-blue); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.list li {
  position: relative; padding-left: 27px;
  font-size: 20px; color: var(--dc-ink); line-height: 1.45;
}
.list li::before {
  content: "➢"; position: absolute; left: 0; top: -.05em;
  color: var(--dc-blue-500); font-size: 17px; font-weight: 700;
}
.list--check li::before { content: "✓"; font-size: 18px; font-weight: 800; }
.list--dot li::before {
  content: ""; left: 5px; top: .55em;
  width: 7px; height: 7px; border-radius: 50%; background: var(--dc-blue-500);
}
.list--num { counter-reset: dcnum; }
.list--num li { padding-left: 44px; }
.list--num li::before {
  counter-increment: dcnum; content: counter(dcnum);
  left: 0; top: .05em; width: 27px; height: 27px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--dc-blue); color: #fff;
  font-family: var(--dc-num); font-size: 15px; font-weight: 700;
}

/* ---------------------------------------------------- 강조 (왼쪽 굵은 색막대) */
.callout {
  position: relative;
  background: var(--dc-panel);
  border: 1px solid var(--dc-line-2);
  border-left: 7px solid var(--dc-blue);
  padding: 13px 20px 13px 18px;
  font-size: 20px; color: var(--dc-ink);
  display: flex; align-items: flex-start; gap: 12px;
}
.callout--tint { background: var(--dc-tint); border-color: var(--dc-line); border-left-color: var(--dc-blue); }
.callout--warn { border-left-color: var(--dc-red); }
.callout--note { border-left-color: var(--dc-orange); }
.callout--solid {
  background: var(--dc-blue); border: none; color: #FFFFFF; font-weight: 700;
}
.callout .emo { font-size: 23px; line-height: 1.15; flex: 0 0 auto; }

/* --------------------------------------------------------------------- 카드 */
.cards { display: grid; gap: 13px; }
.cards--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card {
  background: var(--dc-tint); border: 1px solid var(--dc-line);
  padding: 15px 18px;
  display: flex; flex-direction: column; gap: 6px;
}
.card--plain { background: var(--dc-panel); border-color: var(--dc-line-2); }
.card__badge {
  font-family: var(--dc-num); font-size: 13px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--dc-blue-500);
}
.card__title { font-size: 20px; font-weight: 800; color: var(--dc-navy); letter-spacing: -.02em; }
.card__text { font-size: 18px; color: var(--dc-ink); line-height: 1.45; }
.card__emo { font-size: 26px; line-height: 1; }

/* ----------------------------------------------------------------------- 표 */
.table-wrap { width: 100%; overflow-x: auto; }
.tbl {
  width: 100%; border-collapse: collapse;
  background: var(--dc-panel); font-size: 18px;
}
.tbl th, .tbl td {
  border: 1px solid var(--dc-line);
  padding: 8px 12px; text-align: left; vertical-align: middle;
}
.tbl thead th {
  background: var(--dc-tint-2); color: var(--dc-navy);
  font-weight: 800; text-align: center;
}
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tbody tr:nth-child(even) { background: var(--dc-row); }
.tbl .mark { color: var(--dc-red); font-weight: 700; }
.tbl--grade td { font-size: 22px; font-weight: 800; color: var(--dc-blue); text-align: center; padding: 11px; }
.tbl--plan { font-size: 15px; line-height: 1.3; table-layout: fixed; }
.tbl--plan th { padding: 6px 10px; font-size: 15px; }
.tbl--plan td { padding: 3px 10px; }
.tbl--plan col.subject { width: 64%; }
.tbl--plan col.task { width: 36%; }
.tbl--plan tr.is-current td { background: var(--dc-red-tint); font-weight: 700; }

/* --------------------------------------------------------------- SVG 인포그래픽 */
.fig { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.fig-wrap {
  display: flex; align-items: center; justify-content: center;
  flex: 1 1 auto; min-height: 0; min-width: 0;
}

/* --------------------------------------------------------- 표지 / 챕터 / 끝 */
.cover__band {
  position: absolute; inset: 0 0 auto 0; height: 72%;
  background: var(--dc-cover) center / cover no-repeat, var(--dc-blue);
}
.cover__inner { position: absolute; left: var(--dc-pad-x); top: 190px; }
.cover__course { font-size: 22px; font-weight: 800; color: #CFE6F7; letter-spacing: -.01em; }
.cover__title {
  margin-top: 10px; font-size: 52px; font-weight: 900;
  color: #FFFFFF; letter-spacing: -.035em; line-height: 1.15;
}
.cover__mark { position: absolute; right: 44px; top: 232px; }
.cover__mark .wordmark { font-size: 116px; }
.cover__meta {
  position: absolute; right: var(--dc-pad-x); bottom: 56px;
  text-align: right; color: var(--dc-navy);
}
.cover__meta b { display: block; font-size: 21px; font-weight: 800; }
.cover__meta span { display: block; margin-top: 20px; font-size: 21px; font-weight: 800; }
.cover__stripes { position: absolute; left: 0; right: 0; top: calc(72% - 46px); }

/* 챕터 표지 — 제목은 띠 아래 오른쪽에 온다 */
.chapter__band {
  position: absolute; inset: 0 0 auto 0; height: 52%;
  background: var(--dc-band) center / cover no-repeat, var(--dc-blue);
}
.chapter__stripes { position: absolute; left: 0; right: 0; top: calc(52% - 4px); }
.chapter__badge {
  position: absolute; left: 0; top: calc(52% - 78px);
  width: 116px; height: 138px;
}
.chapter__title {
  position: absolute; right: var(--dc-pad-x); top: calc(52% + 24px);
  text-align: right; font-size: 42px; font-weight: 900;
  color: var(--dc-navy); letter-spacing: -.035em;
}
.chapter__sub {
  position: absolute; right: var(--dc-pad-x); top: calc(52% + 96px);
  text-align: right; font-size: 20px; font-weight: 600; color: var(--dc-ink-2);
}
.chapter__mark { position: absolute; right: 44px; bottom: 28px; }
.chapter__mark .wordmark { font-size: 46px; }

.closing__title {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 68px; font-weight: 900; color: #FFFFFF; letter-spacing: -.04em;
}

/* -------------------------------------------------------------- 다음 차시 */
.next__lines {
  position: absolute; right: var(--dc-pad-x); top: 88px;
  text-align: right; color: #FFFFFF;
  font-size: 22px; font-weight: 800; font-style: italic; line-height: 2;
}

/* --------------------------------------------------------------------- 기타 */
.emo { font-family: var(--dc-emoji); font-style: normal; }
.link { color: var(--dc-blue); font-weight: 700; word-break: break-all; }
.link:hover { color: var(--dc-cyan); }
.linkbox {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px;
  background: var(--dc-tint); border: 1px solid var(--dc-line);
  border-left: 7px solid var(--dc-blue);
  text-decoration: none;
}
.linkbox:hover { background: var(--dc-tint-3); }
.linkbox > .emo { font-size: 22px; }
.linkbox__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.linkbox__label { font-size: 19px; font-weight: 800; color: var(--dc-navy); }
.linkbox__url {
  font-family: var(--dc-num); font-size: 16px; font-weight: 600;
  color: var(--dc-blue); word-break: break-all;
}
.note { font-size: 16px; color: var(--dc-ink-2); }

/* --------------------------------------------------- 빽빽 모드 (is-dense) */
.slide.is-dense .slide__body { gap: 10px; padding-top: 16px; padding-bottom: 42px; }
.slide.is-dense .slide__lede { font-size: 27px; }
.slide.is-dense .h-sub { font-size: 21px; }
.slide.is-dense .p { font-size: 18px; }
.slide.is-dense .p--lg { font-size: 20px; }
.slide.is-dense .list { gap: 8px; }
.slide.is-dense .list li { font-size: 18px; }
.slide.is-dense .callout { font-size: 19px; padding: 11px 16px 11px 15px; }
.slide.is-dense .note { font-size: 15px; }
.slide.is-dense .tbl { font-size: 16px; }
.slide.is-dense .stack { gap: 10px; }
.slide.is-dense .cards { gap: 11px; }
.slide.is-dense .card { padding: 12px 15px; gap: 4px; }
.slide.is-dense .card__title { font-size: 19px; }

/* 아주 작은 글씨가 필요한 안내문 */
.slide.is-tiny .p { font-size: 15.5px; line-height: 1.45; }
.slide.is-tiny .note { font-size: 14px; }
.slide.is-tiny .list li { font-size: 17px; line-height: 1.42; }
.slide.is-tiny .card__text { font-size: 16px; }
.slide.is-tiny .h-sub { font-size: 20px; }
.slide.is-tiny .list { gap: 6px; }
.slide.is-tiny .stack { gap: 8px; }

/* ---------------------------------------------- 세로 배분 (마지막에 정리한다)
   본문·단 안의 요소는 제 높이를 지킨다. 남는 자리를 먹고 줄어드는 것은
   그림(.fig-wrap)과 두 단 묶음(.slide__cols) 뿐이다.
   — 이 규칙이 없으면 표가 눌려 내용이 잘린다. */
.slide__body > *, .stack > * { flex: 0 0 auto; min-height: 0; }
.slide__body > .fig-wrap, .stack > .fig-wrap { flex: 1 1 auto; }
.slide__body > .slide__cols { flex: 1 1 auto; }

/* --------------------------------------------------- 번호 붙은 지침 카드 */
.h-sub__note { font-size: 14px; font-weight: 600; color: var(--dc-ink-3); }
.card__list { margin-top: 2px; }
.card__list li { font-size: 17px; }

.rules { list-style: none; margin: 0; padding: 0; counter-reset: rl;
         display: flex; flex-direction: column; gap: 9px; }
.rule {
  position: relative; display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 14px 10px 46px;
  background: var(--dc-panel); border: 1px solid var(--dc-line-2);
  border-left: 5px solid var(--dc-blue);
}
.rule::before {
  counter-increment: rl; content: counter(rl);
  position: absolute; left: 12px; top: 11px;
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--dc-blue); color: #fff;
  font-family: var(--dc-num); font-size: 14px; font-weight: 700;
}
.rule__body { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
.rule__title { font-size: 15px; font-weight: 800; color: var(--dc-blue); }
.rule__text { font-size: 17px; color: var(--dc-ink); line-height: 1.42; }
.rule__emo { font-size: 20px; flex: 0 0 auto; opacity: .75; }

/* 붉은 점선 강조 — 반드시 지켜야 하는 것 (가운데 맞춤) */
.callout--dashed {
  display: block; text-align: center;
  background: var(--dc-panel);
  border: 2px dashed var(--dc-red); border-left: 2px dashed var(--dc-red);
  padding: 12px 16px;
  font-size: 17px; line-height: 1.55;
}
.callout--dashed .em { display: inline; }
.callout__body { flex: 1 1 auto; min-width: 0; }
.callout--dashed .callout__body { display: block; }
.slide__chiptext { display: inline-block; }
.h-sub__text { display: inline-block; }


/* --- 목차 --------------------------------------------------------------- */
.toc__title { font-size: 36px; font-weight: 700; color: var(--dc-ink2, #63666B); letter-spacing: -.03em; display: flex; align-items: baseline; gap: 14px; }
.toc__bar { color: var(--dc-line); font-weight: 400; }
.toc__en { font-family: var(--dc-num); font-size: 22px; font-weight: 500; color: #8A8F96; letter-spacing: .1em; }
.toc { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.toc__row { display: flex; align-items: baseline; gap: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--dc-line); max-width: 62%; }
.toc__no { font-family: var(--dc-num); font-size: 34px; font-weight: 500; color: var(--dc-blue-500); line-height: 1; min-width: 28px; }
.toc__label { font-size: 25px; font-weight: 800; color: var(--dc-blue); letter-spacing: -.02em; }

/* --- 빽빽한 슬라이드 (나머지는 theme.css) ---------------------------------- */
.slide.is-dense .toc { gap: 10px; }
.slide.is-dense .card { padding: 12px 14px; gap: 4px; }
.slide.is-dense .card__title { font-size: 20px; }
.slide.is-dense .card__text { font-size: 16px; line-height: 1.38; }
.slide.is-dense .card__emo { font-size: 24px; }
.tbl--grade td { font-size: 20px; font-weight: 700; padding: 8px; }

/* --- 주차별 강의 계획 표: 15줄 한 화면 ------------------------------------- */
.slide .tbl.tbl--plan { font-size: 15px; line-height: 1.3; table-layout: fixed; }
.slide .tbl.tbl--plan th { padding: 6px 10px; font-size: 16px; }
.slide .tbl.tbl--plan td { padding: 3px 10px; }
.tbl--plan col.subject { width: 64%; }
.tbl--plan col.task { width: 36%; }

  </style>
</helmet>

</section>
