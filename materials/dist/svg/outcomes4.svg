<?xml version="1.0" encoding="UTF-8"?>
<!-- 수업 목표 달성 네 가지 — 1주차 원본 7쪽 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="자신의 직업흥미, 적성, 가치관을 알 수 있다. / 직업정보를 탐색하고 분석할 수 있다. / 자신의 직무에 적합한 이력서/ 자기소개서를 작성할 수 있다. / 적절한 면접 기법을 학습하여 활용할 수 있다.">
  <g transform="translate(0,0)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🧭</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">첫번째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">자신의 직업흥미, 적성,</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">가치관을 알 수 있다.</text>
  </g>
  <g transform="translate(571,0)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🔍</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">두번째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">직업정보를 탐색하고</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">분석할 수 있다.</text>
  </g>
  <g transform="translate(0,160)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">📄</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">세번째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">자신의 직무에 적합한 이력서/</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">자기소개서를 작성할 수 있다.</text>
  </g>
  <g transform="translate(571,160)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🎤</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">네번째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">적절한 면접 기법을 학습하여</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">활용할 수 있다.</text>
  </g>
</svg>