<?xml version="1.0" encoding="UTF-8"?>
<!-- 교과 목표 네 가지 — 1주차 원본 6쪽 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="자기이해와 직업세계의 이해를 토대로 자신의 진로목표와 이유를 분명히 알 수 있다. / 희망기업 및 직업 분석을 통해 현장에서 요구되는 전문지식을 배우려고 노력할 수 있다. / 취업실무 준비를 위해서 고용환경 변화에 대해 종합적인 시각으로 이해하려고 노력할 수 있다. / 채용시장에서 일어날 수 있는 다양한 문제에 대하여 해결방안을 찾는 방법을 알 수 있다.">
  <g transform="translate(0,0)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🧭</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">첫째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">자기이해와 직업세계의 이해를 토대로</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">자신의 진로목표와 이유를 분명히 알 수 있다.</text>
  </g>
  <g transform="translate(571,0)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🏢</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">둘째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">희망기업 및 직업 분석을 통해 현장에서</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">요구되는 전문지식을 배우려고 노력할 수 있다.</text>
  </g>
  <g transform="translate(0,160)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🌐</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">셋째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">취업실무 준비를 위해서 고용환경 변화에 대해</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">종합적인 시각으로 이해하려고 노력할 수 있다.</text>
  </g>
  <g transform="translate(571,160)">
    <rect width="549" height="140" fill="#F2F7FC" stroke="#9DC3E6"/>
    <text x="26" y="52" font-family="Noto Color Emoji, sans-serif" font-size="30">🧩</text>
    <text x="72" y="42" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="800" fill="#005BAC">넷째</text>
    <text x="72" y="72" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="500" fill="#3B3838">채용시장에서 일어날 수 있는 다양한 문제에</text><text x="72" y="99" font-family="Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#17365D">대하여 해결방안을 찾는 방법을 알 수 있다.</text>
  </g>
</svg>