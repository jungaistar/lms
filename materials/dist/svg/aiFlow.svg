  </g>
  <g transform="translate(172,0)">
    <text x="76" y="14" text-anchor="middle" font-family="Outfit, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#0071CE">STEP 2</text>
    <rect x="0" y="26" width="152" height="86" fill="#DEEBF7" stroke="#9DC3E6" stroke-width="1.5"/>
    <text x="76" y="56" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#17365D">재해석 · 변형</text>
    <text x="76" y="79" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="13" font-weight="600" fill="#63666B">그대로 쓰지 않는다</text>
    <text x="76" y="99" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="14" font-weight="800" fill="#005BAC">필수</text>
