<?xml version="1.0" encoding="UTF-8"?>
<!-- 생성형 AI 사용 흐름 — 이번에 추가 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 174" role="img" aria-label="생성형 AI 사용 흐름: 초안은 AI, 재해석과 핵심 결론은 사람, 출처와 프롬프트는 반드시 명시">
  <g transform="translate(0,0)">
