<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 116" role="img" aria-label="1단계 AI 초안 허용, 2단계 재해석·변형 필수, 3단계 핵심과 결론은 사람이 직접 작성">
  <g transform="translate(0,0)">
