    <rect x="0" y="26" width="152" height="86" fill="#F2F7FC" stroke="#9DC3E6" stroke-width="1.5"/>
    <text x="76" y="56" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="19" font-weight="800" fill="#17365D">AI 초안</text>
    <text x="76" y="79" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="13" font-weight="600" fill="#63666B">생성형 AI 사용</text>
    <text x="76" y="99" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="14" font-weight="800" fill="#005BAC">허용</text>
