<?xml version="1.0" encoding="UTF-8"?>
<!-- 직업심리검사 목록 — 1주차 원본 23쪽 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 300" role="img" aria-label="고용24 직업심리검사 목록에서 대학생 진로준비도검사를 고른다">
