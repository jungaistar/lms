  <text x="256" y="114" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">필수</text>
  <line x1="336" y1="82" x2="354" y2="82" stroke="#0071CE" stroke-width="3" marker-end="url(#fa)"/>
  <rect x="362" y="30" width="148" height="104" rx="8" fill="#005BAC" stroke="#003F7D" stroke-width="1.5"/>
  <text x="436" y="20" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="700" fill="#0071CE" letter-spacing="1">STEP 3</text>
  <text x="436" y="60" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">핵심 · 결론</text>
  <text x="436" y="88" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" fill="#D6E8F7">아이디어 · 최종 분석</text>
  <text x="436" y="112" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="900" fill="#FFF100">사람이 직접 작성</text>
  <rect x="2" y="158" width="508" height="72" rx="8" fill="#FFFFFF" stroke="#C00000" stroke-width="1.5" stroke-dasharray="6 4"/>
