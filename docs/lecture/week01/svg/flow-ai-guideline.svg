<?xml version="1.0" encoding="UTF-8"?>
<!-- 생성형 AI 활용 3단계 흐름 + 출처 표기 · 창업과 기업가 정신 1주차 강의자료 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="248" viewBox="0 0 512 248" role="img" aria-label="생성형 AI 활용 3단계 흐름 + 출처 표기">
  <defs>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0071CE"/></marker>
  </defs>
  <rect x="2" y="30" width="148" height="104" rx="8" fill="#DEEBF7" stroke="#9DC3E6" stroke-width="1.5"/>
  <text x="76" y="20" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="700" fill="#0071CE" letter-spacing="1">STEP 1</text>
  <text x="76" y="66" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="900" fill="#17365D">AI 초안</text>
  <text x="76" y="94" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" fill="#3B3838">생성형 AI 사용</text>
