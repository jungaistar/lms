  <line x1="156" y1="82" x2="174" y2="82" stroke="#0071CE" stroke-width="3" marker-end="url(#fa)"/>
  <rect x="182" y="30" width="148" height="104" rx="8" fill="#4BA3E3" stroke="#2E8BD4" stroke-width="1.5"/>
  <text x="256" y="20" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="700" fill="#0071CE" letter-spacing="1">STEP 2</text>
  <text x="256" y="66" text-anchor="middle" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">재해석 · 변형</text>
