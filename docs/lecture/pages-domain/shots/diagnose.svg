<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="100%" preserveAspectRatio="xMidYMid meet">
<title>오류 진단</title><desc>증상으로 원인 좁히기</desc>
<style>
  text{font-family:'Nanum Gothic','Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;}
  .m{font-family:'NanumGothicCoding','D2Coding','Consolas','Courier New',monospace;}
  .b{font-weight:700;}
  .s10{font-size:10px}.s11{font-size:11px}.s12{font-size:12px}.s13{font-size:13px}
  .s14{font-size:14px}.s16{font-size:16px}.s18{font-size:18px}.s20{font-size:20px}
  .s24{font-size:24px}.s28{font-size:28px}
  .fg{fill:#24292F}.fm{fill:#5B6B7C}.fw{fill:#FFFFFF}.fb{fill:#0969DA}
  .fo{fill:#F26B21}.fn{fill:#0E2A47}.fgr{fill:#1A7F37}.fr{fill:#C4341C}
</style>
<rect x="0" y="0" width="1000" height="490" fill="#FFFFFF"/>
<rect x="340" y="20" width="320" height="52" rx="26" fill="#0E2A47"/><text x="500" y="53" text-anchor="middle" class="s16 b fw">도메인 주소로 무엇이 뜨나?</text><path d="M500 72 V96 M170 96 H830 M170 96 V120 M500 96 V120 M830 96 V120" stroke="#B9C4D0" stroke-width="2" fill="none"/><rect x="30" y="120" width="310" height="150" rx="10" fill="#FDEEEB" stroke="#F0BDB2" stroke-width="1"/><text x="52" y="152" class="s14 b" fill="#C4341C">아무것도 안 뜬다</text><text x="52" y="178" class="s12 fm">사이트에 연결할 수 없음</text><text x="52" y="212" class="s13 b" fill="#0E2A47">→ DNS 문제</text><text x="52" y="238" class="s11 fm">레코드가 없거나 안 퍼졌다</text><rect x="360" y="120" width="310" height="150" rx="10" fill="#FFF8E5" stroke="#EAC54F" stroke-width="1"/><text x="382" y="152" class="s14 b" fill="#8A6100">404 Page not found</text><text x="382" y="178" class="s12 fm">GitHub 안내 페이지</text><text x="382" y="212" class="s13 b" fill="#0E2A47">→ 연결은 됐다</text><text x="382" y="238" class="s11 fm">배포·소스·경로 문제</text><rect x="690" y="120" width="310" height="150" rx="10" fill="#FFF1E7" stroke="#F5C69C" stroke-width="1"/><text x="712" y="152" class="s14 b" fill="#B24A00">https 만 경고</text><text x="712" y="178" class="s12 fm">사이트는 뜨는데</text><text x="712" y="212" class="s13 b" fill="#0E2A47">→ 인증서 문제</text><text x="712" y="238" class="s11 fm">DNS 초록불 뒤 기다린다</text><rect x="30" y="292" width="940" height="180" rx="10" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="30" y="292" width="940" height="34" rx="10" fill="#F4F6F9"/><rect x="30" y="314" width="940" height="12" fill="#F4F6F9"/><text x="54" y="314" class="s12 b fn">확인 순서 — 위에서 아래로</text><text x="54" y="354" class="s12 fm">1.  DNS 가 실제로 퍼졌나  ·  nslookup lms.내도메인.kr 8.8.8.8</text><text x="54" y="380" class="s12 fm">2.  프록시가 꺼져 있나  ·  Cloudflare 회색 구름</text><text x="54" y="406" class="s12 fm">3.  배포가 성공했나  ·  Actions 탭 초록 체크</text><text x="54" y="432" class="s12 fm">4.  Pages 소스가 맞나  ·  Actions 배포인데 브랜치 배포로 되어 있지 않은지</text><text x="54" y="458" class="s12 fm">5.  그래도 빨간불이면  ·  도메인 Remove → 10분 → 재입력</text>
</svg>