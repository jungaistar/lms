<rect x="8" y="128" width="884" height="424" fill="#FFFFFF"/><text x="36" y="168" class="s16 b fg">Custom domain</text><text x="36" y="194" class="s11 fm">Custom domains allow you to serve your site from a domain other than 사용자이름.github.io.</text><rect x="36" y="212" width="320" height="36" rx="6" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><text x="52" y="236" class="s13 m fg">lms.내도메인.kr</text><rect x="370" y="212" width="80" height="36" rx="6" fill="#F4F6F9" stroke="#D9E0E8" stroke-width="1"/><text x="410" y="236" text-anchor="middle" class="s12 fg">Save</text><rect x="462" y="212" width="92" height="36" rx="6" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><text x="508" y="236" text-anchor="middle" class="s12 fr">Remove</text><rect x="32" y="208" width="328" height="44" rx="6" fill="none" stroke="#F26B21" stroke-width="3"/><circle cx="14" cy="230" r="14" fill="#F26B21"/><text x="14" y="235" text-anchor="middle" class="s14 b fw">1</text><rect x="366" y="208" width="88" height="44" rx="6" fill="none" stroke="#F26B21" stroke-width="3"/><circle cx="410" cy="286" r="14" fill="#F26B21"/><text x="410" y="291" text-anchor="middle" class="s14 b fw">2</text><rect x="36" y="320" width="828" height="54" rx="8" fill="#FFF8E5" stroke="#EAC54F" stroke-width="1"/><text x="60" y="352" class="s13 b"fill="#8A6100">⏳  DNS check in progress …   (몇 초 ~ 몇 분)</text><text x="36" y="410" class="s12 fg">이때 GitHub 이 저장소에 CNAME 파일을 자동으로 만든다.</text><text x="36" y="436" class="s12 b fr">GitHub Actions 로 배포한다면 그 파일은 쓰이지 않는다 — 빌드 결과물 안에 CNAME 이 있어야 한다.</text><rect x="36" y="478" width="520" height="26" rx="13" fill="#FFF1E7" stroke="#F26B21" stroke-width="1"/><text x="50" y="496" class="s13 b fo">복사·붙여넣기 대신 직접 타이핑 (보이지 않는 공백 주의)</text>
