<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 8 루트 도메인 A 레코드</title>
  <desc>루트 도메인에 A 레코드 4개를 넣는 화면</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 8</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">루트 도메인을 쓸 때만 — A 레코드 4줄</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">DNS → Add record → Type A → 같은 작업을 네 번</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="400" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">dash.cloudflare.com  →  DNS  →  Records</text>
  </g><rect x="80" y="186" width="1040" height="120" rx="10" fill="#FAFBFC" stroke="#D1D9E0" stroke-width="1"/><text x="108" y="218" font-size="12" fill="#59636E" font-weight="700">Type</text><rect x="108" y="228" width="130" height="38" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="122" y="252" font-size="13.5" fill="#1F2328">A  ▾</text><text x="262" y="218" font-size="12" fill="#59636E" font-weight="700">Name</text><rect x="262" y="228" width="150" height="38" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="276" y="252" font-size="13.5" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">@</text><text x="436" y="218" font-size="12" fill="#59636E" font-weight="700">IPv4 address</text><rect x="436" y="228" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="450" y="252" font-size="13.5" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">185.199.108.153</text><rect x="760" y="230" width="64" height="32" rx="16" fill="#E5E9F2"/><circle cx="776" cy="246" r="12" fill="#FFFFFF" stroke="#C7D2E4"/><text x="834" y="252" font-size="13.5" fill="#1A7F37" font-weight="700">DNS only</text><rect x="950" y="228" width="110" height="38" rx="6" fill="#F38020"/><text x="1005" y="252" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Save</text><rect x="256" y="223" width="162" height="48" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="337" cy="300" r="15" fill="#CF222E"/>
  <text x="337" y="305" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><rect x="430" y="223" width="312" height="48" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="586" cy="300" r="15" fill="#CF222E"/>
  <text x="586" y="305" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text></g><text x="600" y="340" font-size="13.5" fill="#6B7280" text-anchor="middle">① Name 은 @ (또는 도메인 그대로) — "루트"라는 뜻      ② IP 를 하나씩 넣고 저장, 네 번 반복</text><rect x="80" y="366" width="1040" height="124" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="104" y="396" font-size="14" fill="#1B2A4A" font-weight="700">넣어야 하는 IP 네 개</text><rect x="104" y="412" width="230" height="46" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="219" y="441" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace" text-anchor="middle">185.199.108.153</text><rect x="354" y="412" width="230" height="46" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="469" y="441" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace" text-anchor="middle">185.199.109.153</text><rect x="604" y="412" width="230" height="46" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="719" y="441" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace" text-anchor="middle">185.199.110.153</text><rect x="854" y="412" width="230" height="46" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="969" y="441" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace" text-anchor="middle">185.199.111.153</text><rect x="40" y="530" width="1120" height="66" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="56" y="558" font-size="13.5" fill="#7A5B00" font-weight="700">서브도메인(lms.내도메인.kr)만 쓸 거라면 이 장은 건너뛴다</text><text x="56" y="580" font-size="13.5" fill="#7A5B00">루트 도메인은 규격상 CNAME 을 쓸 수 없어 IP 를 직접 적는다. IPv6 까지 하려면 AAAA 4줄을 더 넣는다</text>
</svg>