<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>DNS 관리 화면 (Cloudflare 예시)</title>
  <desc>CNAME 레코드를 추가하는 화면과 프록시 상태 선택 위치</desc>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <rect x="20" y="20" width="920" height="520" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="20" y="20" width="920" height="44" rx="10" fill="#F6F8FA"/><rect x="20" y="52" width="920" height="12" fill="#F6F8FA"/>
  <circle cx="44" cy="42" r="6" fill="#FF5F57"/><circle cx="64" cy="42" r="6" fill="#FEBC2E"/><circle cx="84" cy="42" r="6" fill="#28C840"/>
  <rect x="110" y="30" width="500" height="24" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="124" y="47" font-size="12" fill="#57606A" font-family="ui-monospace, Consolas, monospace">dash.cloudflare.com → 도메인 → DNS → Records</text>

  <text x="48" y="104" font-size="22" font-weight="700" fill="#1F2328">DNS records for example.com</text>
  <rect x="48" y="124" width="150" height="34" rx="6" fill="#F38020"/>
  <text x="123" y="146" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add record</text>

  <g id="form">
    <rect x="48" y="176" width="864" height="180" rx="8" fill="#FAFBFC" stroke="#D0D7DE"/>
    <text x="70" y="206" font-size="12" font-weight="700" fill="#57606A">Type</text>
    <rect x="70" y="216" width="130" height="34" rx="6" fill="#FFF" stroke="#D0D7DE"/><text x="86" y="238" font-size="13" fill="#1F2328">CNAME ▾</text>
    <text x="220" y="206" font-size="12" font-weight="700" fill="#57606A">Name</text>
    <rect x="220" y="216" width="200" height="34" rx="6" fill="#FFF" stroke="#D0D7DE"/><text x="236" y="238" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">lms</text>
    <text x="440" y="206" font-size="12" font-weight="700" fill="#57606A">Target</text>
    <rect x="440" y="216" width="260" height="34" rx="6" fill="#FFF" stroke="#D0D7DE"/><text x="456" y="238" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">사용자이름.github.io</text>
    <text x="720" y="206" font-size="12" font-weight="700" fill="#57606A">Proxy status</text>
    <g id="toggle">
      <rect x="720" y="216" width="60" height="30" rx="15" fill="#E5E9F2"/>
      <circle cx="735" cy="231" r="12" fill="#FFFFFF" stroke="#C7D2E4"/>
      <text x="790" y="236" font-size="13" font-weight="700" fill="#1A7F37">DNS only</text>
    </g>
    <rect x="70" y="286" width="500" height="44" rx="8" fill="#FFF1F0" stroke="#F5C6C2"/>
    <text x="86" y="313" font-size="13" fill="#9B2C2C"><tspan font-weight="700">회색 구름</tspan>이어야 한다. 주황(Proxied)이면 인증서가 안 나온다.</text>
    <rect x="800" y="286" width="112" height="38" rx="6" fill="#F38020"/>
    <text x="856" y="311" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Save</text>
  </g>

  <g id="table">
    <rect x="48" y="380" width="864" height="140" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <rect x="48" y="380" width="864" height="36" rx="8" fill="#F6F8FA"/><rect x="48" y="408" width="864" height="8" fill="#F6F8FA"/>
    <text x="72" y="404" font-size="12" font-weight="700" fill="#57606A">Name</text>
    <text x="330" y="404" font-size="12" font-weight="700" fill="#57606A">Type</text>
    <text x="430" y="404" font-size="12" font-weight="700" fill="#57606A">Content</text>
    <text x="740" y="404" font-size="12" font-weight="700" fill="#57606A">Proxy status</text>
    <line x1="48" y1="452" x2="912" y2="452" stroke="#EEF1F5"/>
    <line x1="48" y1="488" x2="912" y2="488" stroke="#EEF1F5"/>
    <text x="72" y="440" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">lms.example.com</text>
    <text x="330" y="440" font-size="13" fill="#1F2328">CNAME</text>
    <text x="430" y="440" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">사용자이름.github.io</text>
    <text x="740" y="440" font-size="13" fill="#1A7F37">DNS only</text>
    <text x="72" y="476" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">example.com</text>
    <text x="330" y="476" font-size="13" fill="#1F2328">A</text>
    <text x="430" y="476" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">185.199.108.153  (외 3개)</text>
    <text x="740" y="476" font-size="13" fill="#1A7F37">DNS only</text>
    <text x="72" y="512" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">www.example.com</text>
    <text x="330" y="512" font-size="13" fill="#1F2328">CNAME</text>
    <text x="430" y="512" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">사용자이름.github.io</text>
    <text x="740" y="512" font-size="13" fill="#1A7F37">DNS only</text>
  </g>
</svg>
