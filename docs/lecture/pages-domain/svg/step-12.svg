<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 12 도메인 등록 리셋</title>
  <desc>Remove → 대기 → 재입력 3단계</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 12</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">그래도 빨간불이면 — 등록을 리셋한다</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">Remove → 10분 대기 → 다시 입력 → Save</text>
  </g><rect x="40" y="120" width="355" height="300" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><rect x="40" y="120" width="355" height="40" rx="10" fill="#1B2A4A"/><rect x="40" y="148" width="355" height="12" rx="6" fill="#1B2A4A"/><text x="64" y="146" font-size="14" fill="#FFFFFF" font-weight="700">① Remove 를 누른다</text><rect x="64" y="190" width="240" height="36" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="80" y="213" font-size="12.5" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">lms.내도메인.kr</text><rect x="64" y="240" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="114" y="263" font-size="13" fill="#CF222E" text-anchor="middle">Remove</text><rect x="58" y="234" width="112" height="48" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/><text x="64" y="316" font-size="13" fill="#6B7280">사이트 주소가 잠시</text><text x="64" y="340" font-size="13" fill="#6B7280">github.io 로 돌아간다.</text><text x="64" y="372" font-size="13" fill="#1B2A4A" font-weight="700">정상이다.</text><rect x="422" y="120" width="355" height="300" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><rect x="422" y="120" width="355" height="40" rx="10" fill="#1B2A4A"/><rect x="422" y="148" width="355" height="12" rx="6" fill="#1B2A4A"/><text x="446" y="146" font-size="14" fill="#FFFFFF" font-weight="700">② 10분 기다린다</text><circle cx="600" cy="250" r="52" fill="#FFF8E6" stroke="#E3B341" stroke-width="2"/><path d="M600 250 L600 218 M600 250 L622 262" stroke="#8A6100" stroke-width="4" stroke-linecap="round" fill="none"/><text x="600" y="340" font-size="15" fill="#9B2C2C" font-weight="700" text-anchor="middle">건너뛰지 말 것</text><text x="600" y="368" font-size="13" fill="#6B7280" text-anchor="middle">바로 다시 넣으면 같은 캐시를</text><text x="600" y="392" font-size="13" fill="#6B7280" text-anchor="middle">다시 읽어 또 실패한다.</text><rect x="804" y="120" width="356" height="300" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><rect x="804" y="120" width="356" height="40" rx="10" fill="#1B2A4A"/><rect x="804" y="148" width="356" height="12" rx="6" fill="#1B2A4A"/><text x="828" y="146" font-size="14" fill="#FFFFFF" font-weight="700">③ 직접 타이핑 → Save</text><rect x="828" y="190" width="240" height="36" rx="6" fill="#FFFFFF" stroke="#0046C8" stroke-width="2"/><text x="844" y="213" font-size="12.5" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">lms.내도메인.kr|</text><rect x="828" y="240" width="90" height="36" rx="6" fill="#0046C8"/><text x="873" y="263" font-size="13" fill="#FFFFFF" text-anchor="middle">Save</text><text x="828" y="316" font-size="13" fill="#6B7280">5분 뒤 새로고침 →</text><text x="828" y="340" font-size="13" fill="#6B7280">Check again 을 누른다.</text><text x="828" y="372" font-size="13" fill="#1A7F37" font-weight="700">초록불이면 끝.</text><rect x="40" y="450" width="1120" height="90" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="64" y="482" font-size="14" fill="#1B2A4A" font-weight="700">그래도 안 되면 — 순서대로 한 가지씩</text><text x="64" y="512" font-size="13" fill="#6B7280">① CNAME 대신 A 레코드 4개 + AAAA 4개로 바꿔 본다     ② 계정 설정에서 도메인 소유 확인(Verify domain)     ③ 최대 24시간까지는 기다린다</text><rect x="40" y="556" width="1120" height="44" rx="10" fill="#EAF3EC" stroke="#B7DCC0" stroke-width="1"/><text x="56" y="584" font-size="13.5" fill="#2F6B41" font-weight="700">그동안에도 사이트는 http:// 로 열린다 — 못 쓰는 것은 HTTPS 뿐이다</text>
</svg>