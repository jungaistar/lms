<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>루트 도메인과 서브도메인의 DNS 레코드 차이</title>
  <desc>apex 는 A/AAAA 레코드, 서브도메인은 CNAME 레코드를 쓴다</desc>
  <rect width="960" height="470" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2A4A">어떤 레코드를 넣나 — 두 가지 경우</text>
  <rect x="40" y="34" width="4" height="24" fill="#0046C8"/>

  <g id="apex">
    <rect x="40" y="90" width="430" height="300" rx="12" fill="#FFFFFF" stroke="#E5E9F2"/>
    <rect x="40" y="90" width="430" height="46" rx="12" fill="#1B2A4A"/>
    <rect x="40" y="120" width="430" height="16" fill="#1B2A4A"/>
    <text x="64" y="120" font-size="16" font-weight="700" fill="#FFFFFF">경우 A · 루트 도메인 (apex)</text>
    <text x="64" y="170" font-size="15" fill="#4A5568">예:  <tspan font-weight="700" fill="#0046C8">example.com</tspan></text>
    <text x="64" y="200" font-size="14" fill="#6B7280">CNAME 을 쓸 수 없다 (규격상 금지). IP 를 직접 적는다.</text>
    <rect x="64" y="216" width="382" height="150" rx="8" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="80" y="240" font-size="13" font-weight="700" fill="#1B2A4A">A 레코드 4개</text>
    <text x="80" y="264" font-size="13" fill="#4A5568" font-family="ui-monospace, Consolas, monospace">185.199.108.153    185.199.110.153</text>
    <text x="80" y="286" font-size="13" fill="#4A5568" font-family="ui-monospace, Consolas, monospace">185.199.109.153    185.199.111.153</text>
    <text x="80" y="316" font-size="13" font-weight="700" fill="#1B2A4A">AAAA 레코드 4개 (선택)</text>
    <text x="80" y="340" font-size="13" fill="#4A5568" font-family="ui-monospace, Consolas, monospace">2606:50c0:8000::153 … 8003::153</text>
  </g>

  <g id="sub">
    <rect x="490" y="90" width="430" height="300" rx="12" fill="#FFFFFF" stroke="#0046C8" stroke-width="2"/>
    <rect x="490" y="90" width="430" height="46" rx="12" fill="#0046C8"/>
    <rect x="490" y="120" width="430" height="16" fill="#0046C8"/>
    <text x="514" y="120" font-size="16" font-weight="700" fill="#FFFFFF">경우 B · 서브도메인  ← 권장</text>
    <text x="514" y="170" font-size="15" fill="#4A5568">예:  <tspan font-weight="700" fill="#0046C8">lms.example.com</tspan></text>
    <text x="514" y="200" font-size="14" fill="#6B7280">CNAME 한 줄이면 끝. IP 가 바뀌어도 손댈 필요 없다.</text>
    <rect x="514" y="216" width="382" height="150" rx="8" fill="#F5F8FF" stroke="#D6E2FA"/>
    <text x="530" y="244" font-size="13" font-weight="700" fill="#1B2A4A">CNAME 레코드 1개</text>
    <text x="530" y="272" font-size="14" fill="#4A5568" font-family="ui-monospace, Consolas, monospace">이름:   lms</text>
    <text x="530" y="296" font-size="14" fill="#4A5568" font-family="ui-monospace, Consolas, monospace">값:     사용자이름.github.io</text>
    <text x="530" y="330" font-size="13" fill="#B45309">저장소 이름은 붙이지 않는다.</text>
    <text x="530" y="352" font-size="13" fill="#B45309">어느 저장소로 갈지는 GitHub 설정이 정한다.</text>
  </g>

  <rect x="40" y="406" width="880" height="44" rx="10" fill="#FFF1F0" stroke="#F5C6C2"/>
  <text x="64" y="434" font-size="14" fill="#9B2C2C"><tspan font-weight="700">주의</tspan> — Cloudflare 를 쓴다면 프록시(주황 구름)를 끄고 DNS only(회색 구름)로 둔다. 켜두면 인증서가 발급되지 않는다.</text>
</svg>
