<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>오류 진단 흐름도</title>
  <desc>증상별로 원인을 좁혀 가는 판단 순서</desc>
  <rect width="960" height="640" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2A4A">막혔을 때 — 이 순서로 좁힌다</text>
  <rect x="40" y="34" width="4" height="24" fill="#0046C8"/>

  <g id="q1">
    <rect x="330" y="86" width="300" height="56" rx="28" fill="#1B2A4A"/>
    <text x="480" y="120" font-size="16" font-weight="700" fill="#FFF" text-anchor="middle">도메인 주소로 뭐가 뜨나?</text>
  </g>

  <g id="branch1" stroke="#C7D2E4" stroke-width="2" fill="none">
    <path d="M480 142 V172"/><path d="M170 172 H790"/>
    <path d="M170 172 V200"/><path d="M480 172 V200"/><path d="M790 172 V200"/>
  </g>

  <g id="case-a">
    <rect x="40" y="200" width="260" height="150" rx="12" fill="#FFF1F0" stroke="#F5C6C2"/>
    <text x="64" y="230" font-size="15" font-weight="700" fill="#9B2C2C">아무것도 안 뜬다</text>
    <text x="64" y="256" font-size="13" fill="#6B5520">사이트에 연결할 수 없음</text>
    <text x="64" y="286" font-size="13" font-weight="700" fill="#1B2A4A">→ DNS 문제</text>
    <text x="64" y="308" font-size="12" fill="#4A5568">레코드가 없거나 아직 안 퍼졌다</text>
    <text x="64" y="330" font-size="12" fill="#4A5568" font-family="ui-monospace, Consolas, monospace">nslookup 으로 확인</text>
  </g>

  <g id="case-b">
    <rect x="350" y="200" width="260" height="150" rx="12" fill="#FFF8E6" stroke="#F0D9A0"/>
    <text x="374" y="230" font-size="15" font-weight="700" fill="#8A6100">404 Page not found</text>
    <text x="374" y="256" font-size="13" fill="#6B5520">GitHub 안내 페이지가 뜬다</text>
    <text x="374" y="286" font-size="13" font-weight="700" fill="#1B2A4A">→ 연결은 됐다</text>
    <text x="374" y="308" font-size="12" fill="#4A5568">배포물·경로·설정 문제</text>
    <text x="374" y="330" font-size="12" fill="#4A5568">Actions 성공 여부부터 본다</text>
  </g>

  <g id="case-c">
    <rect x="660" y="200" width="260" height="150" rx="12" fill="#F5F8FF" stroke="#D6E2FA"/>
    <text x="684" y="230" font-size="15" font-weight="700" fill="#0046C8">사이트는 뜨는데</text>
    <text x="684" y="252" font-size="15" font-weight="700" fill="#0046C8">https 가 경고</text>
    <text x="684" y="286" font-size="13" font-weight="700" fill="#1B2A4A">→ 인증서 문제</text>
    <text x="684" y="308" font-size="12" fill="#4A5568">DNS check 초록불 뒤</text>
    <text x="684" y="330" font-size="12" fill="#4A5568">발급까지 기다린다</text>
  </g>

  <g id="fixes">
    <rect x="40" y="392" width="880" height="216" rx="12" fill="#FFFFFF" stroke="#E5E9F2"/>
    <rect x="40" y="392" width="880" height="40" rx="12" fill="#F7F9FC"/><rect x="40" y="420" width="880" height="12" fill="#F7F9FC"/>
    <text x="64" y="418" font-size="14" font-weight="700" fill="#1B2A4A">확인 순서 — 위에서 아래로</text>
    <text x="64" y="458" font-size="13" fill="#4A5568"><tspan font-weight="700" fill="#1B2A4A">1.</tspan>  DNS 가 실제로 퍼졌나  ·  nslookup lms.example.com 8.8.8.8</text>
    <text x="64" y="486" font-size="13" fill="#4A5568"><tspan font-weight="700" fill="#1B2A4A">2.</tspan>  프록시가 꺼져 있나  ·  Cloudflare 회색 구름 (주황이면 인증서 실패)</text>
    <text x="64" y="514" font-size="13" fill="#4A5568"><tspan font-weight="700" fill="#1B2A4A">3.</tspan>  배포가 성공했나  ·  저장소 Actions 탭에서 초록 체크</text>
    <text x="64" y="542" font-size="13" fill="#4A5568"><tspan font-weight="700" fill="#1B2A4A">4.</tspan>  Pages 소스가 맞나  ·  Actions 배포인데 &apos;Deploy from a branch&apos; 로 되어 있지 않은지</text>
    <text x="64" y="570" font-size="13" fill="#4A5568"><tspan font-weight="700" fill="#1B2A4A">5.</tspan>  CNAME 파일이 배포물 안에 있나  ·  빌드 결과 폴더의 뿌리에 있어야 한다</text>
    <text x="64" y="598" font-size="13" fill="#4A5568"><tspan font-weight="700" fill="#1B2A4A">6.</tspan>  그래도 빨간불이면  ·  도메인 Remove → 10분 대기 → 다시 입력 → Save</text>
  </g>
</svg>
