<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 4 기본 주소 확인</title>
  <desc>github.io 기본 주소가 열리는지 먼저 확인한다</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 4</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">도메인을 붙이기 전에 기본 주소부터 확인</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">Settings → Pages 상단 "Your site is live at"</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="300" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">github.com/사용자이름/저장소/settings/pages</text>
  </g><text x="90" y="205" font-size="22" fill="#1F2328" font-weight="700">GitHub Pages</text><rect x="90" y="228" width="1020" height="76" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="114" y="260" font-size="14" fill="#1F2328" font-weight="700">Your site is live at</text><text x="268" y="260" font-size="14" fill="#0969DA" font-family="ui-monospace, Consolas, 'Courier New', monospace">https://사용자이름.github.io/저장소/</text><rect x="940" y="244" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="1015" y="266" font-size="13" fill="#1F2328" text-anchor="middle">Visit site</text><text x="114" y="288" font-size="12" fill="#59636E">Last deployed by 사용자 · 2 minutes ago</text><rect x="84" y="222" width="1032" height="88" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="68" cy="266" r="15" fill="#CF222E"/>
  <text x="68" y="271" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g>
  <g class="callout"><circle cx="1130" cy="266" r="15" fill="#CF222E"/>
  <text x="1130" y="271" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text></g><path d="M1112 266 L1096 266" stroke="#CF222E" stroke-width="2.5" fill="none" marker-end="url(#arw)"/><rect x="40" y="440" width="560" height="150" rx="10" fill="#EAF3EC" stroke="#B7DCC0" stroke-width="1"/><text x="64" y="476" font-size="16" fill="#1A7F37" font-weight="700">✓  이 주소가 열린다</text><text x="64" y="508" font-size="13.5" fill="#2F6B41">다음 단계로 간다.</text><text x="64" y="534" font-size="13.5" fill="#2F6B41">도메인 작업은 여기서부터 의미가 있다.</text><rect x="640" y="440" width="520" height="150" rx="10" fill="#FFEBE9" stroke="#F5C6C2" stroke-width="1"/><text x="664" y="476" font-size="16" fill="#9B2C2C" font-weight="700">✕  안 열린다 / 404 가 뜬다</text><text x="664" y="508" font-size="13.5" fill="#7A2C2C">여기부터 해결한다. 기본 주소가 안 되면</text><text x="664" y="534" font-size="13.5" fill="#7A2C2C">도메인을 붙여도 안 열린다.</text>
</svg>