<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 9 DNS 조회로 확인</title>
  <desc>명령 프롬프트에서 nslookup 으로 확인하는 화면</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 9</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">퍼졌는지 내 컴퓨터에서 확인한다</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">시작 → cmd 입력 → 명령 프롬프트에 한 줄</text>
  </g><rect x="40" y="110" width="1120" height="250" rx="10" fill="#0F172A"/><rect x="40" y="110" width="1120" height="34" rx="10" fill="#1E293B"/><rect x="40" y="134" width="1120" height="10" rx="6" fill="#1E293B"/><text x="64" y="132" font-size="12" fill="#94A3B8">명령 프롬프트</text><text x="68" y="180" font-size="14" fill="#E2E8F0" font-family="ui-monospace, Consolas, 'Courier New', monospace">C:\Users\사용자&gt; nslookup -type=cname lms.내도메인.kr 8.8.8.8</text><text x="68" y="236" font-size="14" fill="#94A3B8" font-family="ui-monospace, Consolas, 'Courier New', monospace">서버:    dns.google</text><text x="68" y="264" font-size="14" fill="#94A3B8" font-family="ui-monospace, Consolas, 'Courier New', monospace">Address: 8.8.8.8</text><text x="68" y="320" font-size="14" fill="#4ADE80" font-family="ui-monospace, Consolas, 'Courier New', monospace">lms.내도메인.kr   canonical name = 사용자이름.github.io</text><rect x="60" y="292" width="700" height="34" rx="8" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g class="callout"><circle cx="790" cy="309" r="15" fill="#CF222E"/>
  <text x="790" y="314" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><path d="M772 309 L758 309" stroke="#CF222E" stroke-width="2.5" fill="none" marker-end="url(#arw)"/><text x="816" y="314" font-size="14" fill="#1A7F37" font-weight="700">이 줄이 나오면 성공</text><text x="40" y="400" font-size="17" fill="#1B2A4A" font-weight="700">결과 읽는 법</text><rect x="40" y="420" width="355" height="150" rx="10" fill="#EAF3EC" stroke="#B7DCC0" stroke-width="1"/><text x="64" y="456" font-size="13.5" fill="#1A7F37" font-family="ui-monospace, Consolas, 'Courier New', monospace">사용자이름.github.io</text><text x="64" y="482" font-size="13.5" fill="#1A7F37" font-family="ui-monospace, Consolas, 'Courier New', monospace">185.199.10x.153</text><rect x="64" y="512" width="307" height="1" rx="6" fill="#B7DCC0"/><text x="64" y="542" font-size="13.5" fill="#1A7F37" font-weight="700">정상 — 다음 단계로</text><rect x="415" y="420" width="355" height="150" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="439" y="456" font-size="13.5" fill="#8A6100" font-family="ui-monospace, Consolas, 'Courier New', monospace">찾을 수 없습니다</text><text x="439" y="482" font-size="13.5" fill="#8A6100" font-family="ui-monospace, Consolas, 'Courier New', monospace">NXDOMAIN</text><rect x="439" y="512" width="307" height="1" rx="6" fill="#E3B341"/><text x="439" y="542" font-size="13.5" fill="#8A6100" font-weight="700">아직 안 퍼졌다 — 10분~1시간 대기</text><rect x="790" y="420" width="355" height="150" rx="10" fill="#FFEBE9" stroke="#F5C6C2" stroke-width="1"/><text x="814" y="456" font-size="13.5" fill="#9B2C2C" font-family="ui-monospace, Consolas, 'Courier New', monospace">104.21.x.x</text><text x="814" y="482" font-size="13.5" fill="#9B2C2C" font-family="ui-monospace, Consolas, 'Courier New', monospace">172.67.x.x</text><rect x="814" y="512" width="307" height="1" rx="6" fill="#F5C6C2"/><text x="814" y="542" font-size="13.5" fill="#9B2C2C" font-weight="700">프록시 켜짐 — 회색 구름으로</text><rect x="40" y="590" width="1120" height="66" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="56" y="618" font-size="13.5" fill="#7A5B00" font-weight="700">맥·리눅스는  dig +short lms.내도메인.kr</text><text x="56" y="640" font-size="13.5" fill="#7A5B00">웹으로 보려면 dnschecker.org 에 주소를 넣는다 — 세계 각지에서의 결과를 한 번에 보여 준다</text>
</svg>