<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>브라우저에서 확인하기</title>
  <desc>자물쇠 아이콘과 주소, 그리고 확인해야 할 세 가지</desc>
  <rect width="960" height="420" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2A4A">마지막 확인 — 브라우저에서 세 가지</text>
  <rect x="40" y="34" width="4" height="24" fill="#0046C8"/>

  <rect x="40" y="90" width="880" height="200" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="40" y="90" width="880" height="52" rx="10" fill="#F6F8FA"/><rect x="40" y="130" width="880" height="12" fill="#F6F8FA"/>
  <circle cx="66" cy="116" r="6" fill="#FF5F57"/><circle cx="86" cy="116" r="6" fill="#FEBC2E"/><circle cx="106" cy="116" r="6" fill="#28C840"/>
  <rect x="132" y="102" width="560" height="28" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g id="lock" transform="translate(148,109)">
    <rect x="0" y="5" width="12" height="9" rx="2" fill="#1A7F37"/>
    <path d="M2 5 V3.5 a4 4 0 0 1 8 0 V5" stroke="#1A7F37" stroke-width="1.6" fill="none"/>
  </g>
  <text x="172" y="121" font-size="13" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">https://lms.example.com</text>
  <text x="80" y="190" font-size="20" font-weight="700" fill="#1B2A4A">내 사이트 제목</text>
  <text x="80" y="222" font-size="14" fill="#4A5568">사이트 내용이 정상적으로 보인다.</text>
  <rect x="80" y="240" width="180" height="34" rx="8" fill="#0046C8"/>
  <text x="170" y="262" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">버튼도 잘 눌린다</text>

  <g id="checks">
    <rect x="40" y="316" width="280" height="76" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="64" y="346" font-size="15" font-weight="700" fill="#1B2A4A">① 자물쇠</text>
    <text x="64" y="372" font-size="13" fill="#4A5568">https 로 열리고 경고가 없다</text>
    <rect x="340" y="316" width="280" height="76" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="364" y="346" font-size="15" font-weight="700" fill="#1B2A4A">② 화면</text>
    <text x="364" y="372" font-size="13" fill="#4A5568">README 가 아니라 내 사이트</text>
    <rect x="640" y="316" width="280" height="76" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="664" y="346" font-size="15" font-weight="700" fill="#1B2A4A">③ 새로고침</text>
    <text x="664" y="372" font-size="13" fill="#4A5568">하위 주소에서 F5 → 404 없음</text>
  </g>
</svg>
