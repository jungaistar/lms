<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>GitHub 저장소 Settings → Pages 화면</title>
  <desc>Source, Custom domain, Enforce HTTPS 위치를 표시한 화면 도해</desc>
  <rect width="960" height="560" fill="#FFFFFF"/>
  <rect x="20" y="20" width="920" height="520" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="20" y="20" width="920" height="44" rx="10" fill="#F6F8FA"/>
  <rect x="20" y="52" width="920" height="12" fill="#F6F8FA"/>
  <circle cx="44" cy="42" r="6" fill="#FF5F57"/><circle cx="64" cy="42" r="6" fill="#FEBC2E"/><circle cx="84" cy="42" r="6" fill="#28C840"/>
  <rect x="110" y="30" width="500" height="24" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="124" y="47" font-size="12" fill="#57606A" font-family="ui-monospace, Consolas, monospace">github.com/사용자이름/저장소/settings/pages</text>

  <text x="48" y="104" font-size="22" font-weight="700" fill="#1F2328">GitHub Pages</text>

  <rect x="48" y="126" width="864" height="64" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="68" y="152" font-size="14" font-weight="700" fill="#1F2328">Your site is live at</text>
  <text x="205" y="152" font-size="14" fill="#0969DA">https://lms.example.com/</text>
  <text x="68" y="176" font-size="12" fill="#57606A">Last deployed by 사용자 · 3 minutes ago</text>

  <text x="48" y="226" font-size="17" font-weight="700" fill="#1F2328">Build and deployment</text>
  <text x="48" y="256" font-size="13" font-weight="700" fill="#1F2328">Source</text>
  <rect x="48" y="268" width="200" height="34" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="66" y="290" font-size="14" fill="#1F2328">GitHub Actions  ▾</text>
  <g id="callout-source">
    <rect x="266" y="268" width="330" height="34" rx="17" fill="#FFF4CE" stroke="#E3B341"/>
    <text x="286" y="290" font-size="13" fill="#7A5B00"><tspan font-weight="700">①</tspan> 빌드 방식에 맞게 고른다</text>
  </g>

  <text x="48" y="348" font-size="17" font-weight="700" fill="#1F2328">Custom domain</text>
  <rect x="48" y="364" width="330" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="64" y="388" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, monospace">lms.example.com</text>
  <rect x="390" y="364" width="70" height="36" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="425" y="388" font-size="13" fill="#1F2328" text-anchor="middle">Save</text>
  <rect x="470" y="364" width="86" height="36" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="513" y="388" font-size="13" fill="#CF222E" text-anchor="middle">Remove</text>
  <text x="48" y="422" font-size="13" fill="#1A7F37">✓ DNS check successful</text>
  <g id="callout-domain">
    <rect x="580" y="364" width="332" height="36" rx="18" fill="#FFF4CE" stroke="#E3B341"/>
    <text x="600" y="388" font-size="13" fill="#7A5B00"><tspan font-weight="700">②</tspan> 도메인을 적고 Save → 초록불 확인</text>
  </g>

  <rect x="48" y="452" width="18" height="18" rx="4" fill="#0969DA"/>
  <path d="M52 461 l4 4 l7 -8" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="76" y="467" font-size="14" font-weight="700" fill="#1F2328">Enforce HTTPS</text>
  <text x="76" y="490" font-size="12" fill="#57606A">체크하면 http 로 들어와도 https 로 넘어간다. 인증서 발급 전에는 회색으로 비활성.</text>
  <g id="callout-https">
    <rect x="580" y="446" width="332" height="34" rx="17" fill="#FFF4CE" stroke="#E3B341"/>
    <text x="600" y="468" font-size="13" fill="#7A5B00"><tspan font-weight="700">③</tspan> 마지막에 체크한다</text>
  </g>
</svg>
