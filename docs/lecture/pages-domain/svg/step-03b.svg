<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 3+ 배포 성공 확인</title>
  <desc>Actions 탭에서 배포 워크플로 성공 여부 확인</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 3+</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">빌드형이라면 배포가 성공했는지 본다</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">저장소 → Actions 탭 → 최근 실행</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="380" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">github.com/사용자이름/저장소/actions</text>
  </g><text x="90" y="210" font-size="18" fill="#1F2328" font-weight="700">All workflows</text><rect x="90" y="236" width="1020" height="56" rx="8" fill="#EAF3EC" stroke="#B7DCC0" stroke-width="1"/><text x="116" y="270" font-size="17" fill="#1A7F37" font-weight="700">✓</text><text x="146" y="270" font-size="14" fill="#1F2328" font-weight="700">Deploy web to GitHub Pages</text><text x="900" y="270" font-size="12.5" fill="#59636E">main · 2분 전</text><rect x="90" y="298" width="1020" height="56" rx="8" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="116" y="332" font-size="17" fill="#1A7F37" font-weight="700">✓</text><text x="146" y="332" font-size="14" fill="#1F2328">Deploy web to GitHub Pages</text><text x="900" y="332" font-size="12.5" fill="#59636E">main · 어제</text><rect x="90" y="360" width="1020" height="56" rx="8" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="116" y="394" font-size="17" fill="#CF222E" font-weight="700">✕</text><text x="146" y="394" font-size="14" fill="#1F2328">Deploy web to GitHub Pages</text><text x="900" y="394" font-size="12.5" fill="#59636E">main · 3일 전</text><rect x="84" y="230" width="1032" height="68" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="68" cy="264" r="15" fill="#CF222E"/>
  <text x="68" y="269" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><rect x="40" y="510" width="1120" height="66" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="56" y="538" font-size="13.5" fill="#7A5B00" font-weight="700">① 맨 위 실행에 초록 체크(✓)가 있어야 사이트가 새 내용으로 바뀐다</text><text x="56" y="560" font-size="13.5" fill="#7A5B00">빨간 ✕ 면 눌러서 로그를 본다. 배포가 실패한 채로 도메인을 붙이면 옛 화면이나 404 가 뜬다</text>
</svg>