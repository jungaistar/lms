<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 10 GitHub 도메인 등록</title>
  <desc>Custom domain 칸에 주소를 넣고 저장</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="660" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 10</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">GitHub 에 도메인을 등록한다</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">Settings → Pages → Custom domain → Save</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="420" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">github.com/사용자이름/저장소/settings/pages</text>
  </g><text x="90" y="208" font-size="19" fill="#1F2328" font-weight="700">Custom domain</text><text x="90" y="238" font-size="12.5" fill="#59636E">Custom domains allow you to serve your site from a domain other than 사용자이름.github.io.</text><rect x="90" y="256" width="380" height="40" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="108" y="282" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">lms.내도메인.kr</text><rect x="486" y="256" width="90" height="40" rx="6" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="531" y="282" font-size="13.5" fill="#1F2328" text-anchor="middle">Save</text><rect x="592" y="256" width="106" height="40" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="645" y="282" font-size="13.5" fill="#CF222E" text-anchor="middle">Remove</text><rect x="84" y="250" width="392" height="52" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="62" cy="276" r="15" fill="#CF222E"/>
  <text x="62" y="281" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><rect x="480" y="250" width="102" height="52" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="531" cy="330" r="15" fill="#CF222E"/>
  <text x="531" y="335" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text></g><path d="M531 322 L531 308" stroke="#CF222E" stroke-width="2.5" fill="none" marker-end="url(#arw)"/><rect x="90" y="360" width="1020" height="60" rx="8" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="114" y="396" font-size="14" fill="#7A5B00" font-weight="700">⏳  DNS check in progress …   (몇 초~몇 분)</text><text x="90" y="456" font-size="13.5" fill="#1F2328">이때 GitHub 이 저장소에 CNAME 파일을 자동으로 만든다.</text><text x="90" y="484" font-size="13.5" fill="#9B2C2C" font-weight="700">GitHub Actions 로 배포한다면 그 파일은 쓰이지 않는다 — 빌드 결과물 안에 CNAME 이 들어가야 한다.</text><rect x="40" y="552" width="1120" height="66" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="56" y="580" font-size="13.5" fill="#7A5B00" font-weight="700">① 도메인을 직접 타이핑한다   ② Save 를 누른다</text><text x="56" y="602" font-size="13.5" fill="#7A5B00">복사·붙여넣기는 보이지 않는 공백이 섞이는 사고가 잦다. 앞뒤에 http:// 나 / 를 붙이지 않는다</text>
</svg>