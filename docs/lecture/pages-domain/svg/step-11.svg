<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 11 DNS 검사 실패 화면</title>
  <desc>InvalidDNSError 화면과 원인 세 가지</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 11</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">빨간 글씨가 떴다면 — 오류 화면 읽기</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">Settings → Pages → Custom domain 아래</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="330" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">github.com/사용자이름/저장소/settings/pages</text>
  </g><rect x="80" y="180" width="1040" height="48" rx="8" fill="#FFEBE9" stroke="#F5C6C2" stroke-width="1"/><text x="104" y="210" font-size="13.5" fill="#9B2C2C">Domain lms.내도메인.kr is not eligible for HTTPS at this time.</text><text x="90" y="268" font-size="17" fill="#1F2328" font-weight="700">Custom domain</text><rect x="90" y="284" width="380" height="40" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="108" y="310" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">lms.내도메인.kr</text><rect x="486" y="284" width="90" height="40" rx="6" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="531" y="310" font-size="13.5" fill="#1F2328" text-anchor="middle">Save</text><rect x="592" y="284" width="106" height="40" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="645" y="310" font-size="13.5" fill="#CF222E" text-anchor="middle">Remove</text><text x="90" y="350" font-size="13.5" fill="#CF222E" font-weight="700">⚠ DNS check unsuccessful</text><rect x="90" y="366" width="1020" height="62" rx="8" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="114" y="392" font-size="13.5" fill="#7A5B00" font-weight="700">lms.내도메인.kr is improperly configured</text><text x="114" y="414" font-size="12.5" fill="#6B5520">Domain's DNS record could not be retrieved. (InvalidDNSError)</text><rect x="950" y="378" width="140" height="36" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="1020" y="401" font-size="13" fill="#1F2328" text-anchor="middle">Check again</text>
  <g class="callout"><circle cx="62" cy="350" r="15" fill="#CF222E"/>
  <text x="62" y="355" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><rect x="944" y="372" width="152" height="48" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="1130" cy="396" r="15" fill="#CF222E"/>
  <text x="1130" y="401" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text></g><path d="M1112 396 L1098 396" stroke="#CF222E" stroke-width="2.5" fill="none" marker-end="url(#arw)"/><text x="40" y="486" font-size="17" fill="#1B2A4A" font-weight="700">이 오류의 원인은 셋 중 하나다</text><rect x="40" y="506" width="355" height="130" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><circle cx="70" cy="536" r="14" fill="#1B2A4A"/><text x="70" y="541" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="96" y="541" font-size="14.5" fill="#1B2A4A" font-weight="700">레코드가 아직 안 퍼졌다</text><text x="64" y="578" font-size="13" fill="#6B7280">STEP 9 로 돌아가 조회한다</text><text x="64" y="602" font-size="13" fill="#6B7280">아무것도 안 나오면 더 기다린다</text><rect x="415" y="506" width="355" height="130" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><circle cx="445" cy="536" r="14" fill="#1B2A4A"/><text x="445" y="541" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="471" y="541" font-size="14.5" fill="#1B2A4A" font-weight="700">프록시가 켜져 있다</text><text x="439" y="578" font-size="13" fill="#6B7280">조회 결과가 104·172.67 이면</text><text x="439" y="602" font-size="13" fill="#6B7280">Cloudflare 에서 회색 구름으로</text><rect x="790" y="506" width="355" height="130" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><circle cx="820" cy="536" r="14" fill="#1B2A4A"/><text x="820" y="541" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="846" y="541" font-size="14.5" fill="#1B2A4A" font-weight="700">GitHub 이 옛 실패를 캐시</text><text x="814" y="578" font-size="13" fill="#6B7280">조회는 정상인데 여기만 빨간불</text><text x="814" y="602" font-size="13" fill="#6B7280">→ 다음 장 리셋 절차</text><rect x="40" y="650" width="1120" height="44" rx="10" fill="#FFEBE9" stroke="#F5C6C2" stroke-width="1"/><text x="56" y="678" font-size="13.5" fill="#9B2C2C" font-weight="700">먼저 STEP 9 의 조회로 "진짜 DNS 상태"를 확인한다 — 화면 글씨보다 조회 결과가 정확하다</text>
</svg>