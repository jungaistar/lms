<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 13 HTTPS 적용</title>
  <desc>DNS 검사 성공 후 Enforce HTTPS 체크</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 13</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">초록불 확인 → HTTPS 를 켠다</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">Settings → Pages → DNS check successful → Enforce HTTPS</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="380" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">github.com/사용자이름/저장소/settings/pages</text>
  </g><rect x="90" y="180" width="1020" height="66" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="114" y="212" font-size="14" fill="#1F2328" font-weight="700">Your site is live at</text><text x="258" y="212" font-size="14" fill="#0969DA" font-family="ui-monospace, Consolas, 'Courier New', monospace">https://lms.내도메인.kr/</text><text x="114" y="234" font-size="12" fill="#59636E">Last deployed 1 minute ago</text><text x="90" y="288" font-size="17" fill="#1F2328" font-weight="700">Custom domain</text><rect x="90" y="304" width="380" height="40" rx="6" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="108" y="330" font-size="14" fill="#1F2328" font-family="ui-monospace, Consolas, 'Courier New', monospace">lms.내도메인.kr</text><text x="90" y="372" font-size="14" fill="#1A7F37" font-weight="700">✓ DNS check successful</text><rect x="84" y="358" width="260" height="26" rx="8" fill="none" stroke="#1A7F37" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g class="callout"><circle cx="62" cy="371" r="15" fill="#CF222E"/>
  <text x="62" y="376" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><rect x="90" y="404" width="22" height="22" rx="4" fill="#0969DA"/><path d="M95 415 l5 5 l8 -10" stroke="#fff" stroke-width="2.5" fill="none"/><text x="124" y="421" font-size="14.5" fill="#1F2328" font-weight="700">Enforce HTTPS</text><text x="124" y="448" font-size="12.5" fill="#59636E">http 로 들어와도 https 로 넘어간다. 인증서가 발급되기 전에는 회색으로 비활성.</text><rect x="84" y="398" width="300" height="34" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="420" cy="415" r="15" fill="#CF222E"/>
  <text x="420" y="420" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text></g><path d="M404 415 L390 415" stroke="#CF222E" stroke-width="2.5" fill="none" marker-end="url(#arw)"/><rect x="40" y="512" width="545" height="100" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/><text x="64" y="546" font-size="15" fill="#7A5B00" font-weight="700">체크박스가 회색이면</text><text x="64" y="576" font-size="13" fill="#6B5520">인증서 발급 중이다. 5~15분(길면 1시간) 뒤 새로고침.</text><rect x="615" y="512" width="545" height="100" rx="10" fill="#FFEBE9" stroke="#F5C6C2" stroke-width="1"/><text x="639" y="546" font-size="15" fill="#9B2C2C" font-weight="700">성급하게 켜지 말 것</text><text x="639" y="576" font-size="13" fill="#7A2C2C">인증서 없이 강제하면 사이트가 아예 안 열린다.</text>
</svg>