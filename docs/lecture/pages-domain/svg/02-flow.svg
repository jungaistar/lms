<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>도메인 연결 5단계 흐름</title>
  <desc>저장소 준비부터 HTTPS 적용까지의 다섯 단계</desc>
  <rect width="960" height="300" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2A4A">전체 흐름 — 다섯 단계</text>
  <rect x="40" y="34" width="4" height="24" fill="#0046C8"/>
  <g id="steps">
    <g><rect x="40" y="100" width="164" height="120" rx="12" fill="#FFFFFF" stroke="#0046C8" stroke-width="2"/>
      <circle cx="70" cy="130" r="15" fill="#0046C8"/><text x="70" y="136" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="122" y="172" font-size="16" font-weight="700" fill="#1B2A4A" text-anchor="middle">Pages 켜기</text>
      <text x="122" y="196" font-size="13" fill="#6B7280" text-anchor="middle">저장소 → Settings</text></g>
    <g><rect x="224" y="100" width="164" height="120" rx="12" fill="#FFFFFF" stroke="#E5E9F2"/>
      <circle cx="254" cy="130" r="15" fill="#1B2A4A"/><text x="254" y="136" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="306" y="172" font-size="16" font-weight="700" fill="#1B2A4A" text-anchor="middle">도메인 입력</text>
      <text x="306" y="196" font-size="13" fill="#6B7280" text-anchor="middle">Custom domain</text></g>
    <g><rect x="408" y="100" width="164" height="120" rx="12" fill="#FFFFFF" stroke="#E5E9F2"/>
      <circle cx="438" cy="130" r="15" fill="#1B2A4A"/><text x="438" y="136" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="490" y="172" font-size="16" font-weight="700" fill="#1B2A4A" text-anchor="middle">DNS 레코드</text>
      <text x="490" y="196" font-size="13" fill="#6B7280" text-anchor="middle">A 또는 CNAME</text></g>
    <g><rect x="592" y="100" width="164" height="120" rx="12" fill="#FFFFFF" stroke="#E5E9F2"/>
      <circle cx="622" cy="130" r="15" fill="#1B2A4A"/><text x="622" y="136" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="674" y="172" font-size="16" font-weight="700" fill="#1B2A4A" text-anchor="middle">DNS 검사</text>
      <text x="674" y="196" font-size="13" fill="#6B7280" text-anchor="middle">초록불 확인</text></g>
    <g><rect x="776" y="100" width="144" height="120" rx="12" fill="#FFFFFF" stroke="#E5E9F2"/>
      <circle cx="806" cy="130" r="15" fill="#1B2A4A"/><text x="806" y="136" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="848" y="172" font-size="16" font-weight="700" fill="#1B2A4A" text-anchor="middle">HTTPS</text>
      <text x="848" y="196" font-size="13" fill="#6B7280" text-anchor="middle">Enforce 체크</text></g>
  </g>
  <g stroke="#C7D2E4" stroke-width="2" marker-end="url(#ah2)" fill="none">
    <path d="M208 160 H220"/><path d="M392 160 H404"/><path d="M576 160 H588"/><path d="M760 160 H772"/>
  </g>
  <defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C7D2E4"/></marker></defs>
  <text x="40" y="264" font-size="14" fill="#6B7280">3번과 4번 사이에 <tspan font-weight="700" fill="#1B2A4A">DNS 전파 시간</tspan>이 있다. 보통 1~10분, 길면 24시간까지 기다린다.</text>
</svg>
