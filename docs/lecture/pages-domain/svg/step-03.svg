<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>STEP 3 배포 방식 선택</title>
  <desc>Pages 의 Source 드롭다운에서 배포 방식을 고른다</desc>
  <defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#CF222E"/></marker>
  <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/></marker>
</defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  
  <g class="step-head">
    <rect x="40" y="26" width="96" height="34" rx="17" fill="#0046C8"/>
    <text x="88" y="49" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">STEP 3</text>
    <text x="152" y="51" font-size="24" fill="#1B2A4A" font-weight="700">배포 방식(Source)을 고른다</text>
    <text x="40" y="82" font-size="13" fill="#6B7280">Settings → Pages → Build and deployment → Source</text>
  </g>
  <g class="browser">
    <rect x="40" y="110" width="1120" height="520" rx="10" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <rect x="40" y="110" width="1120" height="44" rx="10" fill="#F6F8FA"/><rect x="40" y="140" width="1120" height="14" rx="0" fill="#F6F8FA"/>
    <circle cx="64" cy="132" r="6" fill="#FF5F57"/>
    <circle cx="84" cy="132" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="132" r="6" fill="#28C840"/>
    <rect x="128" y="120" width="1000" height="24" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="144" y="137" font-size="12" fill="#59636E" font-family="ui-monospace, Consolas, 'Courier New', monospace">github.com/사용자이름/저장소/settings/pages</text>
  </g><text x="90" y="210" font-size="22" fill="#1F2328" font-weight="700">GitHub Pages</text><text x="90" y="262" font-size="17" fill="#1F2328" font-weight="700">Build and deployment</text><text x="90" y="296" font-size="13" fill="#1F2328" font-weight="700">Source</text><rect x="90" y="310" width="240" height="36" rx="6" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="110" y="333" font-size="13.5" fill="#1F2328">Deploy from a branch  ▾</text><rect x="84" y="304" width="252" height="48" rx="8" fill="none" stroke="#CF222E" stroke-width="2.5" stroke-dasharray="7 4"/>
  <g class="callout"><circle cx="68" cy="328" r="15" fill="#CF222E"/>
  <text x="68" y="333" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text></g><rect x="90" y="380" width="1020" height="230" rx="10" fill="#FAFBFC" stroke="#D1D9E0" stroke-width="1"/><text x="114" y="412" font-size="15" fill="#1B2A4A" font-weight="700">어느 쪽을 고르나</text><rect x="114" y="430" width="480" height="160" rx="8" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/><text x="136" y="460" font-size="15" fill="#1F2328" font-weight="700">Deploy from a branch</text><text x="136" y="488" font-size="13" fill="#59636E">HTML 파일을 그대로 올려 둔 경우</text><text x="136" y="512" font-size="13" fill="#59636E">브랜치와 폴더를 고르면 끝</text><text x="136" y="552" font-size="12.5" fill="#6B7280">예) index.html 을 직접 커밋</text><rect x="614" y="430" width="480" height="160" rx="8" fill="#EAF3EC" stroke="#B7DCC0" stroke-width="1"/><text x="636" y="460" font-size="15" fill="#1A7F37" font-weight="700">GitHub Actions</text><text x="636" y="488" font-size="13" fill="#2F6B41">React · Vue 처럼 빌드가 필요한 경우</text><text x="636" y="512" font-size="13" fill="#2F6B41">워크플로가 만든 결과물이 올라간다</text><text x="636" y="552" font-size="12.5" fill="#2F6B41">예) npm run build → dist/</text><rect x="90" y="636" width="1020" height="66" rx="10" fill="#FFEBE9" stroke="#F5C6C2" stroke-width="1"/><text x="106" y="664" font-size="13.5" fill="#9B2C2C" font-weight="700">① Source 드롭다운을 눌러 내 프로젝트에 맞는 쪽을 고른다</text><text x="106" y="686" font-size="13.5" fill="#9B2C2C">빌드가 필요한데 Deploy from a branch 로 두면 README 가 렌더된 페이지가 뜬다 — 가장 흔한 실수</text>
</svg>