<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>GitHub Pages 동작 개요</title>
  <desc>저장소에 올린 정적 파일이 GitHub Pages 를 통해 사용자 브라우저에 전달되는 흐름</desc>
  <rect width="960" height="420" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2A4A">GitHub Pages 는 어떻게 동작하나</text>
  <rect x="40" y="34" width="4" height="24" fill="#0046C8"/>

  <g id="repo">
    <rect x="40" y="110" width="220" height="150" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="150" y="146" font-size="17" font-weight="700" fill="#1B2A4A" text-anchor="middle">① 저장소</text>
    <text x="150" y="176" font-size="14" fill="#4A5568" text-anchor="middle">index.html</text>
    <text x="150" y="200" font-size="14" fill="#4A5568" text-anchor="middle">style.css · app.js</text>
    <text x="150" y="230" font-size="13" fill="#6B7280" text-anchor="middle">GitHub 에 push</text>
  </g>

  <g id="build">
    <rect x="300" y="110" width="220" height="150" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="410" y="146" font-size="17" font-weight="700" fill="#1B2A4A" text-anchor="middle">② 빌드 · 배포</text>
    <text x="410" y="176" font-size="14" fill="#4A5568" text-anchor="middle">브랜치 배포 또는</text>
    <text x="410" y="198" font-size="14" fill="#4A5568" text-anchor="middle">GitHub Actions</text>
    <text x="410" y="230" font-size="13" fill="#6B7280" text-anchor="middle">정적 파일 묶음 생성</text>
  </g>

  <g id="pages">
    <rect x="560" y="110" width="220" height="150" rx="12" fill="#1B2A4A"/>
    <text x="670" y="146" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">③ Pages 서버</text>
    <text x="670" y="176" font-size="14" fill="#C7D2E4" text-anchor="middle">전 세계 CDN</text>
    <text x="670" y="198" font-size="14" fill="#C7D2E4" text-anchor="middle">무료 · 무제한 트래픽*</text>
    <text x="670" y="230" font-size="13" fill="#9FB0CC" text-anchor="middle">HTTPS 인증서 자동</text>
  </g>

  <g id="user">
    <rect x="820" y="110" width="100" height="150" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
    <text x="870" y="150" font-size="17" font-weight="700" fill="#1B2A4A" text-anchor="middle">④</text>
    <text x="870" y="180" font-size="14" fill="#4A5568" text-anchor="middle">방문자</text>
    <text x="870" y="204" font-size="14" fill="#4A5568" text-anchor="middle">브라우저</text>
  </g>

  <g id="arrows" stroke="#0046C8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M264 185 H296"/>
    <path d="M524 185 H556"/>
    <path d="M784 185 H816"/>
  </g>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0046C8"/>
    </marker>
  </defs>

  <g id="note">
    <rect x="40" y="300" width="880" height="80" rx="12" fill="#FFF8E6" stroke="#F0D9A0"/>
    <text x="64" y="332" font-size="15" font-weight="700" fill="#8A6100">서버가 없다 = 서버 관리도 없다</text>
    <text x="64" y="358" font-size="14" fill="#6B5520">데이터베이스나 서버 프로그램은 못 돌린다. HTML · CSS · JS 로 된 정적 사이트만 올라간다.</text>
    <text x="820" y="372" font-size="11" fill="#9A8550" text-anchor="end">* 공정 사용 범위 내 (월 100GB 권장)</text>
  </g>
</svg>
