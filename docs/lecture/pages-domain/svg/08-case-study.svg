<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans KR Thin', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>실전 사례 타임라인 — lms.miraejob.co.kr</title>
  <desc>실제 저장소를 도메인에 붙이면서 밟은 단계와 걸린 함정</desc>
  <rect width="960" height="620" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1B2A4A">실전 사례 — lms.miraejob.co.kr 붙이기</text>
  <rect x="40" y="34" width="4" height="24" fill="#0046C8"/>
  <text x="40" y="80" font-size="14" fill="#6B7280">2026-08-20 · 실제로 밟은 순서와 그때 걸린 것들</text>

  <line x1="92" y1="110" x2="92" y2="560" stroke="#E5E9F2" stroke-width="3"/>

  <g id="s1">
    <circle cx="92" cy="140" r="13" fill="#0046C8"/><text x="92" y="145" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
    <text x="128" y="134" font-size="16" font-weight="700" fill="#1B2A4A">DNS 부터 읽었다</text>
    <text x="128" y="158" font-size="13" fill="#4A5568">apex 와 www 는 이미 GitHub 을 가리키는데 <tspan font-family="ui-monospace, Consolas, monospace">lms</tspan> 만 없었다 (NXDOMAIN).</text>
    <text x="128" y="178" font-size="13" fill="#6B7280">추측하지 않고 조회부터 한 것이 시간을 아꼈다.</text>
  </g>

  <g id="s2">
    <circle cx="92" cy="222" r="13" fill="#0046C8"/><text x="92" y="227" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
    <text x="128" y="216" font-size="16" font-weight="700" fill="#1B2A4A">자산 경로를 상대 경로로 바꿨다</text>
    <text x="128" y="240" font-size="13" fill="#4A5568"><tspan font-family="ui-monospace, Consolas, monospace">base: &apos;/저장소이름/&apos;</tspan> → <tspan font-family="ui-monospace, Consolas, monospace">&apos;./&apos;</tspan></text>
    <text x="128" y="260" font-size="13" fill="#6B7280">도메인 주소와 github.io 주소 양쪽에서 같은 빌드가 돌아 전환 중에도 화면이 안 죽는다.</text>
  </g>

  <g id="s3">
    <circle cx="92" cy="304" r="13" fill="#0046C8"/><text x="92" y="309" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
    <text x="128" y="298" font-size="16" font-weight="700" fill="#1B2A4A">CNAME 파일을 배포물에 넣었다</text>
    <text x="128" y="322" font-size="13" fill="#4A5568"><tspan font-family="ui-monospace, Consolas, monospace">web/public/CNAME</tspan> → 빌드하면 <tspan font-family="ui-monospace, Consolas, monospace">dist/CNAME</tspan> 으로 복사된다</text>
    <text x="128" y="342" font-size="13" fill="#B45309">저장소 뿌리의 CNAME 은 Actions 배포에서는 쓰이지 않는다 ← 여기서 헷갈렸다</text>
  </g>

  <g id="s4">
    <circle cx="92" cy="386" r="13" fill="#0046C8"/><text x="92" y="391" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">4</text>
    <text x="128" y="380" font-size="16" font-weight="700" fill="#1B2A4A">Cloudflare 에 CNAME 한 줄</text>
    <text x="128" y="404" font-size="13" fill="#4A5568"><tspan font-family="ui-monospace, Consolas, monospace">lms</tspan> → <tspan font-family="ui-monospace, Consolas, monospace">jungaistar.github.io</tspan> · 회색 구름(DNS only)</text>
    <text x="128" y="424" font-size="13" fill="#6B7280">응답이 GitHub IP 로 나오면 프록시가 꺼진 것이다.</text>
  </g>

  <g id="s5">
    <circle cx="92" cy="468" r="13" fill="#C53030"/><text x="92" y="473" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">!</text>
    <text x="128" y="462" font-size="16" font-weight="700" fill="#9B2C2C">DNS check unsuccessful (InvalidDNSError)</text>
    <text x="128" y="486" font-size="13" fill="#4A5568">DNS 는 정상인데 GitHub 이 예전 실패를 캐시하고 있었다.</text>
    <text x="128" y="506" font-size="13" fill="#6B7280">도메인을 먼저 저장하고 레코드를 나중에 넣으면 자주 생긴다.</text>
  </g>

  <g id="s6">
    <circle cx="92" cy="550" r="13" fill="#1A7F37"/><text x="92" y="555" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">✓</text>
    <text x="128" y="544" font-size="16" font-weight="700" fill="#1B2A4A">해결 — 등록 리셋</text>
    <text x="128" y="568" font-size="13" fill="#4A5568">Remove → 10분 대기 → 재입력 → Save → Check again → 초록불 → Enforce HTTPS</text>
  </g>

  <rect x="640" y="110" width="280" height="120" rx="12" fill="#F7F9FC" stroke="#E5E9F2"/>
  <text x="664" y="140" font-size="14" font-weight="700" fill="#1B2A4A">교훈 한 줄</text>
  <text x="664" y="168" font-size="13" fill="#4A5568">레코드를 먼저 넣고,</text>
  <text x="664" y="190" font-size="13" fill="#4A5568">GitHub 도메인 저장은 그 다음.</text>
  <text x="664" y="214" font-size="12" fill="#6B7280">순서를 지키면 대부분의 오류가 안 생긴다.</text>
</svg>
