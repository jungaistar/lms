name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '농협/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록한다.
          # anon key 는 공개되어도 되는 값이다 — 실제 접근 통제는 RLS 가 한다.
          # service_role key 는 절대 여기에 넣지 않는다.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 강의용 실습본(농협/)을 같은 사이트에 얹는다.
      # 빌드가 필요 없는 정적 HTML 이라 산출물에 그대로 복사한다.
      # 폴더 이름이 한글이면 주소가 %EB%86%8D%ED%98%91 로 인코딩되므로
      # 게시 경로만 nonghyup 으로 바꾼다 (저장소 안 폴더 이름은 농협/ 그대로).
      - name: 강의 실습본을 Pages 산출물에 넣는다
        run: |
          mkdir -p web/dist/nonghyup
          cp 농협/*.html web/dist/nonghyup/
          ls -la web/dist/nonghyup/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
